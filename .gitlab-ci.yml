stages:
  - update

update-readme:
  stage: update
  image: python:3.9-slim
  rules:
    # Runs on scheduled pipelines or manual triggers via the UI
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - pip install feedparser requests
    - apt-get update && apt-get install -y git
  script:
    - |
      python3 -c "
      import sys, re, requests, feedparser
      from time import strftime

      feed_url = 'https://wyssmann.com/blog/index.xml'
      file_path = 'README.md'
      start_tag = '<!-- feed start -->'
      end_tag   = '<!-- feed end -->'

      headers = {'User-Agent': 'Mozilla/5.0 (compatible; WyssmannFeedBot/1.0)'}
      r = requests.get(feed_url, headers=headers, timeout=30)
      r.raise_for_status()

      feed = feedparser.parse(r.content)
      if not feed.entries:
          print('Feed empty. bozo=%s exc=%s' % (feed.bozo, getattr(feed,'bozo_exception',None)))
          print('Body head:', r.text[:500])
          sys.exit(1)

      entries = []
      for e in feed.entries[:10]:
          title = getattr(e, 'title', 'Untitled')
          link  = getattr(e, 'link', '#')
          if getattr(e, 'published_parsed', None):
              date = strftime('%Y-%m-%d', e.published_parsed)
          else:
              date = 'Unknown date'
          entries.append(f'- {date} [{title}]({link})')

      new_content = '\n'.join(entries)

      with open(file_path) as f:
          original = f.read()

      if start_tag not in original or end_tag not in original:
          print('ERROR: feed markers not found in README.md')
          sys.exit(1)

      pattern = re.escape(start_tag) + r'.*?' + re.escape(end_tag)
      replacement = f'{start_tag}\n{new_content}\n{end_tag}'
      updated = re.sub(pattern, lambda m: replacement, original, flags=re.DOTALL)

      if updated == original:
          print('README.md already up to date.')
          sys.exit(0)

      with open(file_path, 'w') as f:
          f.write(updated)
      print('README.md updated successfully.')
      "

    # Push the changes back to the repo
    - git config --global user.email "ci@wyssmann.com"
    - git config --global user.name "CI Bot"
    - git add README.md
    - |
      if git commit -m "docs: update feed [skip ci]"; then
        # Use a Project Access Token for authentication
        git push "https://project_${CI_PROJECT_ID}_bot:${GL_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}
      else
        echo "No changes to commit"
      fi